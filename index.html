<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ÉlecPlan – Schéma unifilaire, plan de position et contrôle RGIE</title>
<style>
#prev{position:fixed;inset:0;z-index:60;background:#6b7280;display:flex;flex-direction:column}#prev[hidden]{display:none}.pvbar{display:flex;gap:10px;align-items:center;padding:8px 12px;background:#fff;border-bottom:1px solid #d1d5db}#pvBody{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:14px;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}.pvpage{margin:0 auto;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4);width:min(100%,1100px);aspect-ratio:297/210;flex:none}.pvpage svg{width:100%;height:100%;display:block}
@page{size:A4 landscape;margin:0}
@media print{body>*:not(#prev){display:none!important}#prev{position:static;background:#fff;display:block}.pvbar{display:none}#pvBody{padding:0;gap:0;display:block;overflow:visible}.pvpage{width:297mm!important;height:210mm;margin:0;box-shadow:none;page-break-after:always;break-after:page}}
:root{--bg:#f1f3f6;--panel:#fff;--line:#d8dde4;--ink:#1c2430;--mut:#667386;--acc:#1f6feb;--accbg:#e8f0fe;--err:#b91c1c;--errbg:#fee2e2;--warn:#b45309;--warnbg:#fef3c7;--ok:#15803d;--okbg:#dcfce7}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);overscroll-behavior:none}
button,select,input,textarea{font:inherit;color:inherit}
button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{background:#f4f6f9}
button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.danger{color:var(--err)}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:5px 7px;background:#fff;max-width:100%;width:100%}
input[type=checkbox],input[type=radio]{width:auto}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.steps{display:flex;gap:6px;flex:1;min-width:0}
.step{flex:1;min-width:0;padding:7px 8px;text-align:center;border-radius:9px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .n{display:inline-flex;width:20px;height:20px;border-radius:50%;background:#e5e7eb;align-items:center;justify-content:center;font-size:12px;margin-right:5px}
.step.on .n{background:var(--acc);color:#fff}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;font-size:11px;color:#fff;margin-left:4px;line-height:18px}
.badge.e{background:var(--err)}.badge.w{background:var(--warn)}.badge.o{background:var(--ok)}
#main{flex:1;display:flex;min-height:0;position:relative}
aside{background:var(--panel);overflow:auto}
#palette{width:260px;border-right:1px solid var(--line)}
#palette.min{width:48px;overflow:hidden}#palette.min .palx{display:none}#palMin{float:right;margin:4px;padding:6px 10px;font-size:15px}
#inspector{width:310px;border-left:1px solid var(--line)}
#stage{flex:1;position:relative;min-width:0;background:#e9ecf1;overflow:hidden}
#svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#rgie{position:absolute;inset:0;overflow:auto;padding:14px;background:var(--bg)}
#toolbar{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 16px);z-index:3}
#toolbar button{box-shadow:0 1px 2px rgba(0,0,0,.1)}
#pendbar{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);display:flex;gap:6px;background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:6}#pendbar[hidden]{display:none}#pendbar button{min-width:44px;height:44px;font-size:18px;border-radius:8px;border:1px solid #cbd5e1;background:#f8fafc}#pendbar button.ok{background:#16a34a;color:#fff;border-color:#16a34a}#pendbar button.no{color:#dc2626}
#hint{position:absolute;left:8px;bottom:8px;background:rgba(28,36,48,.9);color:#fff;border-radius:8px;padding:6px 10px;z-index:3;max-width:70%;pointer-events:none}
#fab{display:none}
.sym{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sym *{vector-effect:non-scaling-stroke}
.sym text{fill:currentColor;stroke:none;font:700 6.5px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;vector-effect:none}
.sec{padding:12px}
.sec h4{margin:0 0 8px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile.armed{outline:2px solid #1f6feb;background:#e8f1ff}
.tile{display:flex;align-items:center;gap:8px;text-align:left;padding:8px;font-size:13px}
.tile svg{flex:none}
.f{display:grid;grid-template-columns:104px 1fr;gap:6px 8px;align-items:center;margin-bottom:10px}
.f label{color:var(--mut);font-size:13px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut)}
.pg{padding:8px 12px;border-top:1px solid var(--line)}
.pg h5{margin:0 0 6px;display:flex;align-items:center;gap:6px;font-size:13px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.pi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin-bottom:4px;padding:5px 8px}
.pi.done{opacity:.45}
.pi.armed{background:var(--accbg);border-color:var(--acc)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.issue{border-left:5px solid;border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.issue.err{border-left-color:var(--err)}.issue.warn{border-left-color:var(--warn)}.issue.info{border-left-color:var(--acc)}
.issue .ref{font-size:12px;color:var(--mut)}
.banner{border-radius:12px;padding:14px;font-weight:600;margin-bottom:12px}
.banner.ok{background:var(--okbg);color:var(--ok)}.banner.bad{background:var(--errbg);color:var(--err)}.banner.mid{background:var(--warnbg);color:var(--warn)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
#modal[hidden]{display:none}
#modal .box{background:#fff;border-radius:14px;padding:16px;max-width:680px;width:100%;max-height:92vh;overflow:auto}
#modal .mhead{position:sticky;top:-16px;margin:-16px -16px 10px;padding:12px 16px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);z-index:2}#modal .mhead button{font-size:18px;min-width:44px;height:40px}#modal .mfoot{position:sticky;bottom:-16px;margin:12px -16px -16px;padding:10px 16px;background:#fff;border-top:1px solid var(--line)}
#modal textarea{height:200px;font:11px/1.3 ui-monospace,monospace}
#dragghost{position:fixed;z-index:50;pointer-events:none;background:#fff;border:1px solid var(--acc);border-radius:10px;padding:4px 8px;box-shadow:0 4px 14px rgba(0,0,0,.28);display:flex;align-items:center;gap:6px;font-size:12px;max-width:240px}
#dragghost[hidden]{display:none}
.tile,.pi{user-select:none;-webkit-user-select:none}
.tile[data-add],.tile[data-newc],.tile[data-addsrc],.pi:not(.done),.tile[data-free]{cursor:grab}
.grip{touch-action:none;color:var(--mut);padding:0 4px;font-size:16px;line-height:1}
@media (max-width:860px){
 #palette,#inspector{position:absolute;left:0;right:0;bottom:0;width:auto;height:55%;z-index:6;border:0;border-top:2px solid var(--line);display:none;box-shadow:0 -4px 12px rgba(0,0,0,.15)}
 #palette.open,#inspector.open{display:block}
 #palette.min{width:auto;height:auto}
 #fab{display:flex;position:absolute;right:8px;bottom:8px;gap:6px;z-index:7}
 #fab button{box-shadow:0 1px 4px rgba(0,0,0,.25);padding:9px 13px}
 #hint{max-width:52%;bottom:58px}
 header{padding:4px 6px;gap:4px}
 .steps{flex:1 1 100%;gap:4px}
 .step{display:flex;flex-direction:column;align-items:center;justify-content:center;white-space:normal;overflow:visible;padding:4px 2px;font-size:11.5px;line-height:1.15;min-height:46px}
 .step .n{margin:0 0 2px;width:18px;height:18px;font-size:11px}
 .step .t{display:block}
 header>button{flex:1 1 0;min-width:0;padding:7px 4px;font-size:13px}
 #undo,#redo,#btnHelp{flex:0 0 40px}
}
</style>
</head>

  <button id="undo" title="Annuler">↶</button><button id="redo" title="Rétablir">↷</button>

</div>

 else{if(!M.qualite.trim())add('warn','Qualité du responsable non renseignée','À indiquer avec le nom sur les schémas et plans.','Livre 1 – 3.1.2.1',{proj:1});}

 const lc={};S.circuits.forEach(c=>{if(c.letter)(lc[c.letter]=lc[c.letter]||[]).push(c)});Object.keys(lc).forEach(L=>{if(lc[L].length>1)add('err','Lettre de circuit en double : '+L,'Chaque circuit élémentaire est identifié par une lettre majuscule unique.','Livre 1 – 3.1.2.1',{view:'uni'})});
 // Circuits : canalisations, protections
 if(!S.circuits.length)add('err','Aucun circuit','Le schéma unifilaire doit représenter les circuits de l’installation.','Livre 1 – 3.1.2.2',{view:'uni'});

  if(hasL&&!hasP&&c.sec<1.5)add('err','Section insuffisante – circuit '+cname(c),'Un circuit d’éclairage demande au moins 1,5 mm².','Livre 1 – tableau des sections minimales',go,1);

  els.filter(e=>SYM[e.kind].role==='commande'&&!(e.targets||[]).length).forEach(e=>add('warn','Commande sans point commandé – '+REF[e.id],'Indiquez le(s) point(s) lumineux commandé(s) pour le repérage sur le plan.','Livre 1 – 3.1.2.1 / guide',{view:'uni',t:'el',id:e.id},1));
  // différentiels

function cableLen(c){
 let t=0;S.floors.forEach(f=>{const els=S.elements.filter(e=>e.circ===c.id&&e.pos&&e.pos.f===f.id);if(!els.length)return;
  const tb=S.elements.find(e=>e.kind==='tab'&&e.pos&&e.pos.f===f.id);let cur=tb?tb.pos:els[0].pos;
  els.forEach(e=>{t+=Math.abs(e.pos.x-cur.x)+Math.abs(e.pos.y-cur.y)+150;cur=e.pos})});
 return t/100;
}
function matRows(){
 const R=[['Catégorie','Désignation','Quantité']];

 if(+S.meta.origMa)R.push(['Tableau','Différentiel d’origine '+S.meta.origMa+' mA',1]);
 S.boards.forEach(b=>{R.push(['Tableau','Coffret intermédiaire ('+b.name+')',1]);(b.head||[]).forEach(hd=>R.push(['Tableau',(hd.t==='diff'?'Différentiel '+hd.a+' A / '+hd.ma+' mA type '+hd.type:'Disjoncteur '+hd.a+' A')+' – tête de '+b.name,1]))});
 S.diffs.forEach(d=>R.push(['Tableau','Différentiel '+d.a+' A / '+d.ma+' mA type '+d.type+' ('+d.name+')',1]));
 const br={};S.circuits.forEach(c=>{const k=(c.crb||'C')+c.a+' · '+(c.pol||'2P');br[k]=(br[k]||0)+1});Object.keys(br).sort((a,b)=>parseInt(a.slice(1))-parseInt(b.slice(1))).forEach(k=>R.push(['Tableau','Disjoncteur courbe '+k.slice(0,1)+' '+k.slice(1).replace(' · ',' A · '),br[k]]));
 const ap={};S.elements.forEach(e=>{const s=SYM[e.kind];if(s.role==='tableau')return;ap[s.name]=(ap[s.name]||0)+1});Object.keys(ap).forEach(n=>R.push(['Appareillage',n,ap[n]]));
 const cb={};S.circuits.forEach(c=>{const k=cableText(c)+' mm²';cb[k]=(cb[k]||0)+cableLen(c)});Object.keys(cb).forEach(k=>R.push(['Câbles (longueur estimée, m)',k,Math.ceil(cb[k])]));
 return R;
}

 else if((e.key==='Delete'||e.key==='Backspace')&&UI.view==='plan'){UI.sel&&UI.sel.t==='el'?mutate(()=>{elOf(UI.sel.id).pos=null;UI.sel=null}):delPlanSel()}
 else if((e.key==='r'||e.key==='R')&&UI.view==='plan'){if(UI.tool==='archi'){UI.rot=(UI.rot+90)%360;renderStage()}else if(UI.tool==='place'||UI.tool==='freeplace'){UI.pr=(UI.pr+90)%360;renderStage()}else if(UI.sel&&UI.sel.t==='el')mutate(()=>{const p=elOf(UI.sel.id).pos;p.v=p.v?0:1});else if(UI.sel&&UI.sel.t==='free')mutate(()=>{const z=floor().free.find(x=>x.id===UI.sel.id);z.v=z.v?0:1})}
 else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo()}
 else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();doRedo()}
});

 else if(t==='mirror'){if(UI.tool==='place'||UI.tool==='freeplace'){UI.fm=UI.fm?0:1;renderStage()}else if(UI.sel&&UI.sel.t==='el')mutate(()=>{const p=elOf(UI.sel.id).pos;p.m=p.m?0:1});else if(UI.sel&&UI.sel.t==='free')mutate(()=>{const z=floor().free.find(x=>x.id===UI.sel.id);z.m=z.m?0:1})}
 else if(t==='porte'||t==='fen')setTool('archi',t);

 else if(t==='unplace'){if(UI.sel&&UI.sel.t==='el')mutate(()=>{elOf(UI.sel.id).pos=null;UI.sel=null})}
 else if(t==='del')delPlanSel();

const DD={pending:false,moved:false,p:null,sx:0,sy:0,label:'',justDragged:false};
const ghostEl=$('#dragghost');
function ddLabelEl(id){const e=elOf(id),s=SYM[e.kind];return '<svg width="22" height="22" viewBox="-14 -14 28 28">'+symG(s,'#111827',1)+'</svg><b>'+esc(REF[id]||'')+'</b> '+esc(trunc(e.desig||s.name,16))}
function ddBegin(e,payload,label){DD.pending=true;DD.moved=false;DD.p=payload;DD.sx=e.clientX;DD.sy=e.clientY;DD.label=label}
function showGhost(){ghostEl.innerHTML=DD.label;ghostEl.hidden=false;document.body.classList&&document.body.classList.add('dragging')}
function moveGhost(e){ghostEl.style.left=(e.clientX+14)+'px';ghostEl.style.top=(e.clientY+10)+'px'}
function overSvg(e){const t=document.elementFromPoint(e.clientX,e.clientY);return !!(t&&t.closest&&t.closest('#svg'))}
const cname=c=>LET[c.id]+' – '+c.label;
const countPoints=cid=>uniRows(S.elements.filter(e=>e.circ===cid)).filter(r=>r.items.some(e=>isPointK(e.kind))).length;
const rowGen=id=>{const e=elOf(id);return !!e&&SYM[e.kind].role!=='commande'&&!isLamp(e)};
const limit8=(cid,kind)=>S.elements.some(e=>e.circ===cid&&SYM[e.kind].role==='prise')||(kind&&SYM[kind].role==='prise');
const DEDIC_K=['chauf','chaufAcc','chaufAccV','ce','ceAcc'];
const isDedicK=k=>!!(SYM[k]&&SYM[k].dedic)||DEDIC_K.includes(k);
const isPointK=k=>{const r=SYM[k]&&SYM[k].role;return r==='prise'||r==='eclairage'||r==='appareil'};
function ruleModal(t,m,ref){openModal(t,'<p style="margin:0 0 8px;line-height:1.45">'+esc(m)+'</p>'+(ref?'<div class="mut" style="font-size:12px">'+esc(ref)+'</div>':'')+'<div class="row" style="margin-top:12px"><button class="pri" id="rmok">Compris</button></div>');$('#rmok').onclick=()=>{if(Date.now()-modalAt<650)return;$('#modal').hidden=true}}
function insertCheck(cid,kind,swId){
 const c=circ(cid),els=S.elements.filter(e=>e.circ===cid),K=SYM[kind];if(!c||!K)return null;
 const pts=els.filter(e=>isPointK(e.kind));
 if(lampKind(kind)&&!swId)return els.some(isCmd)?['Une lampe se place à la suite de son interrupteur','Touchez le « + » vert au bout d’une ligne d’interrupteur ou de détecteur.','']:['Une lampe ne peut pas être seule sur un circuit','Ajoutez d’abord un interrupteur ou un détecteur, puis ajoutez la lampe avec le « + » vert de sa ligne.','Guide RGIE – commande des points lumineux'];
 if(swId&&rowGen(swId)){if(K.role!=='prise'&&K.role!=='appareil'&&K.role!=='boite')return['Seuls une prise, un appareil ou une boîte se placent sur cette ligne','Choisissez une prise, un appareil fixe ou une boîte pour ce « + » vert, ou un « + » bleu entre deux lignes pour un autre symbole.','']}
 else if(swId&&!lampKind(kind)&&K.role!=='commande')return['Seuls une lampe ou une commande se placent sur une ligne d’interrupteur','Choisissez une lampe, un interrupteur, un va-et-vient, un permutateur ou un bouton-poussoir pour ce « + » vert. Les autres symboles se placent avec un « + » bleu, entre deux lignes.',''];
 if(K.role==='prise'&&c.sec<2.5)return['Prise de courant impossible sur ce câble','Le circuit '+cname(c)+' est en '+String(c.sec).replace('.',',')+' mm² : une prise exige au moins 2,5 mm². Augmentez la section du circuit, ou utilisez un autre circuit.','Livre 1 – sections minimales (guide BELOR : 2,5 mm² pour les prises et circuits mixtes)'];
 if(K.role==='commande'&&!swId){
  const dd=pts.find(e=>isDedicK(e.kind));
  if(dd)return['Inutile de commander ce circuit','Le circuit '+cname(c)+' est dédié à '+SYM[dd.kind].name.toLowerCase()+' : aucune lampe ne peut y être ajoutée, donc aucun interrupteur.','Livre 1 – 5.2.1.2'];
  if(limit8(cid,null)&&countPoints(cid)>=8&&!c.old)return['Circuit complet : 8 points maximum','Le circuit '+cname(c)+' compte déjà 8 points : aucune nouvelle ligne de lampes ne peut y être ajoutée, donc inutile d’y mettre un interrupteur. Créez un nouveau circuit.','Livre 1 – 5.3.5.2 b'];
 }
 if(isPointK(kind)){
  const oneSock=pts.length===1&&SYM[pts[0].kind].role==='prise';
  if(isDedicK(kind)&&pts.length&&!oneSock)return['Cet appareil doit avoir son propre circuit',K.name+' fait partie des appareils alimentés par un circuit exclusivement dédié (four, taque, lave-vaisselle, lave-linge, sèche-linge, chauffe-eau, chauffage fixe, appareil > 2 600 W). Le circuit '+cname(c)+' alimente déjà d’autres points.','Livre 1 – 5.2.1.2'];
  const dd=pts.find(e=>isDedicK(e.kind));
  if(dd&&!(K.role==='prise'&&pts.length===1))return['Ce circuit est dédié à un appareil','Le circuit '+cname(c)+' alimente '+SYM[dd.kind].name.toLowerCase()+', qui exige un circuit exclusif : rien d’autre ne peut y être raccordé.','Livre 1 – 5.2.1.2'];
  if(!swId&&limit8(cid,kind)&&countPoints(cid)>=8&&!c.old)return['Maximum 8 socles de prise par circuit','Le circuit '+cname(c)+' alimente des prises et compte déjà 8 points (RGIE : 8 socles simples ou multiples ; un appareil fixe ou des lampes commandés par un même interrupteur comptent pour un socle). Créez un nouveau circuit, ou ajoutez la prise à une ligne existante avec son « + » vert.','Livre 1 – 5.3.5.2 b'];
 }
 return null;
}
function candKinds(cid,swId){
 const all=[...new Set(Object.values(CT).flatMap(t=>t.allow))].filter(k=>SYM[k]&&k!=='prise2');
 let ks;
 if(swId){ks=rowGen(swId)?all.filter(k=>['prise','appareil','boite'].includes(SYM[k].role)):all.filter(k=>lampKind(k)||SYM[k].role==='commande')}
 else ks=all.filter(k=>!lampKind(k));
 return ks;
}
const HELP=[
{t:'Que doit contenir le schéma unifilaire ?',k:'unifilaire schema contenu obligatoire mentions canalisation section conducteurs mode de pose differentiel disjoncteur interrupteur boite derivation prise point lumineux appareil source',x:'Pour une installation domestique, le schéma unifilaire reprend au moins : le type, la section et le nombre de conducteurs de chaque canalisation, le mode de pose, les dispositifs différentiels (type et caractéristiques), les dispositifs contre les surintensités, les interrupteurs, boîtes de connexion et de dérivation, socles de prise, points lumineux, machines et appareils fixes, et les sources (transformateur, panneau solaire, onduleur, batterie…).',r:'RGIE 3.1.2.2 a'},
{t:'Que doit contenir le plan de position ?',k:'plan position contenu obligatoire tableau boites prises points lumineux interrupteurs appareils sources',x:'Le plan de position indique la place des tableaux de répartition, boîtes de connexion et de dérivation, socles de prise, points lumineux, interrupteurs, machines et appareils fixes, et des sources dont il est question sur le schéma unifilaire. Toute modification ou extension doit y figurer : il reflète à tout moment la situation existante.',r:'RGIE 3.1.2.3 a et 3.1.2.1'},
{t:'Numérotation : lettres et numéros',k:'numerotation lettre circuit numero ordre reference A1 interrupteur identification repere',x:'Chaque circuit porte une lettre majuscule. Chaque point lumineux, socle de prise et unité de commande reçoit un numéro, dans l\'ordre où on les rencontre en partant du dispositif de protection. Sur le plan, chaque élément porte la lettre du circuit et son numéro du schéma ; un interrupteur porte la lettre du circuit et le numéro du point lumineux ou de l\'appareil qu\'il commande (ex. A2-3).',r:'RGIE 3.1.2.1 a'},
{t:'Mentions obligatoires (cartouche)',k:'cartouche mentions nom qualite tva adresse version date numero signature tension courant responsable organisme agree',x:'Sur le schéma unifilaire et le plan de position : nom, qualité et n° de TVA du responsable de l\'exécution des travaux, adresse de l\'installation, numéro, version et date du document. La tension et la nature du courant sont indiquées sur le schéma. En cas de conformité, l\'exécutant et l\'organisme agréé signent et datent schémas et plans.',r:'RGIE 3.1.2.1 a'},
{t:'Partie ancienne d\'une installation',k:'ancienne partie 1981 ancien existant modification extension importante',x:'Toute partie de l\'installation dont la réalisation sur place a commencé avant le 1/10/1981 et qui figure sur le schéma unifilaire est repérée « partie ancienne ». Pour une modification ou extension non importante, une description succincte datée et signée suffit, mais le plan de position doit être mis à jour.',r:'RGIE 3.1.2.1 a'},
{t:'Symboles autorisés',k:'symboles tableau 2.23 legende autre symbole',x:'Les symboles du tableau 2.23 sont à utiliser. S\'il n\'existe pas de symbole pour un élément, tout autre symbole clairement identifiable est admis à condition de le définir dans la légende du schéma et du plan.',r:'RGIE 2.13 et 3.1.2.1 a'},
{t:'8 socles de prise maximum par circuit',k:'8 huit prises socles maximum circuit nombre limite points assimile appareil fixe lampes',x:'Le nombre de socles de prise simples ou multiples est limité à huit par circuit terminal. Un appareil fixe, ou un ensemble d\'appareils fixes commandés par un même appareil de manœuvre (par ex. des lampes sur un interrupteur), compte pour un socle quand le circuit alimente aussi des prises. Un circuit d\'éclairage seul n\'est pas visé par cette limite. Dans ÉlecPlan : une ligne du schéma = un point.',r:'RGIE 5.3.5.2 b'},
{t:'Prises et éclairage sur un même circuit',k:'prises eclairage meme circuit melange mixte appareils fixes circuit dedie',x:'Socles, appareils d\'éclairage et autres appareils fixes peuvent partager un circuit, sauf les appareils fixes des circuits dédiés. Les règles applicables sont alors celles des circuits de prises.',r:'RGIE 5.3.5.2 b'},
{t:'Nombre de circuits d\'éclairage',k:'eclairage circuits distincts deux locaux logement unite habitation',x:'Dans une unité d\'habitation de plus de deux locaux et/ou emplacements, l\'éclairage est alimenté par au moins deux circuits distincts.',r:'RGIE 5.3.5.2 b'},
{t:'Section minimale des conducteurs : 2,5 ou 1,5 mm² ?',k:'section 1,5 2,5 mm2 conducteur cable minimale prise eclairage luminaire commande 0,75 0,5',x:'En principe, section minimale 2,5 mm². Exceptions : 1,5 mm² pour les circuits sans socle de prise (éclairage, par ex.), à l\'exception d\'un socle unique de 2,5 A intégré dans un luminaire ; 0,75 mm² dans les tableaux pour un socle simple ; 0,5 mm² pour commande, contrôle, signalisation et mesure. Une prise exige donc au moins 2,5 mm² ; de l\'éclairage peut être en 2,5 mm².',r:'RGIE 5.2.1.2, tableau 5.1'},
{t:'Circuits dédiés (un appareil = un circuit)',k:'circuit dedie lave-linge lave-vaisselle seche-linge cuisiniere taque four chauffage electrique 2600 W puissance appareil propre circuit',x:'Chaque appareil ou machine à poste fixe de 2600 W ou plus a son propre circuit. Lave-linge, lave-vaisselle, sèche-linge, cuisinière, taque et four électriques ont aussi chacun un circuit dédié. Le chauffage électrique à poste fixe est alimenté par un ou plusieurs circuits dédiés. Rien d\'autre ne peut être raccordé à un circuit dédié.',r:'RGIE 5.2.1.2'},
{t:'Différentiel à l\'origine (300 mA)',k:'differentiel origine 300 mA tete installation sectionnement disjoncteur general',x:'Au moins un dispositif différentiel de 300 mA maximum est placé à l\'origine de l\'installation domestique ; il assure aussi la fonction de sectionnement.',r:'RGIE 4.2.4.3 b'},
{t:'Différentiel 30 mA : quels circuits ?',k:'differentiel 30 mA haute sensibilite prises eclairage salle de bain lave-linge seche-linge lave-vaisselle 8 circuits',x:'Au moins un différentiel à haute sensibilité (30 mA) alimente : les prises non destinées à des appareils fixes, l\'éclairage, les lieux avec baignoire ou douche, les lave-linges, sèche-linges et lave-vaisselles. Maximum 8 circuits terminaux par différentiel 30 mA. Des différentiels supplémentaires peuvent alimenter les appareils fixes (frigo, cuisinière, chauffage…) sans cette limite.',r:'RGIE 4.2.4.3 b'},
{t:'Terre supérieure à 30 Ω',k:'terre resistance dispersion 30 ohms prise de terre deux differentiels 16 socles',x:'Si la résistance de dispersion de la prise de terre dépasse 30 Ω, il faut au moins deux différentiels à haute sensibilité, chacun alimentant au maximum seize socles de prise (simples ou multiples) ; un appareil fixe ou un ensemble commandé en commun compte comme un socle.',r:'RGIE 4.2.4.3 b'},
{t:'Type de différentiel et calibre en tête',k:'differentiel type A 40 A calibre tete intensite',x:'Les différentiels des installations domestiques sont au moins de type A ; ceux placés en tête de l\'installation ont une intensité nominale d\'au moins 40 A.',r:'RGIE 5.3.5.3 a'},
{t:'Chauffage par résistances noyées',k:'chauffage resistances noyees paroi 100 mA differentiel separe',x:'Un chauffage électrique par résistances noyées dans une paroi, alimenté au-dessus de 25 V alternatif, est protégé séparément par un différentiel de 100 mA maximum.',r:'RGIE 4.2.4.3 b'},
{t:'Matériel de classe 0 interdit',k:'classe 0 0I interdit masses conducteur de protection',x:'Les machines et appareils de classe 0 et 0I sont interdits dans les installations domestiques. Les masses du matériel de classe I sont reliées au conducteur de protection.',r:'RGIE 4.2.4.3 a'},
{t:'Socles de prise : contact de terre et protection',k:'socle prise contact terre IP protection norme 16A boite encastree',x:'Dans une installation domestique, tous les socles (hors TBTS) ont un contact de terre relié au conducteur de protection. Les socles jusqu\'à 16 A / 250 V ont au moins le degré de protection IPXX-D. Les socles encastrés sont logés dans des boîtes métalliques ou isolantes.',r:'RGIE 5.3.5.2 a et b'},
{t:'Conducteurs interdits',k:'interdit conduite eau gaz sol parties metalliques conducteur',x:'Il est interdit d\'utiliser comme conducteur normal d\'énergie : conduites d\'eau ou de gaz, parties métalliques de la construction, enveloppes métalliques de conducteurs isolés, circuit de chauffage, sol.',r:'RGIE 5.2.1.2'},
{t:'Salle de bain : volumes 0, 1, 2',k:'salle de bain douche baignoire volume 0 1 2 boite derivation tableau prise interrupteur TBTS',x:'Boîtes de dérivation, de jonction ou de connexion interdites dans le volume 0. Tableaux de répartition interdits dans les volumes 0, 1 et 2. Volume 0 : ni prises ni appareils de commande (sauf TBTS lié à un appareil fixe adapté). Volume 1 : seulement appareils fixes en TBTS ou en BT connectés en permanence, prises et commandes en TBTS. Volume 2 : appareils fixes, et prises en BT sous conditions de protection renforcée (différentiel très haute sensibilité). Consultez le chapitre 7.1 pour les dimensions des volumes.',r:'RGIE 7.1.5.2'},
{t:'Caractéristiques des sources',k:'source transformateur panneau solaire onduleur hacheur redresseur batterie puissance tension',x:'Les caractéristiques des sources (transformateur, panneau solaire, onduleur, hacheur, batterie…) sont indiquées sur le schéma unifilaire ou tenues à disposition dans le dossier de l\'installation. Dans ÉlecPlan : sélectionnez la source et remplissez « Caractéristiques » (ex. Uprim/Usec · Pn).',r:'RGIE 2.13, tableau 2.23 H'},
{t:'Documents à remettre et conservation',k:'documents dossier rapport controle signes proprietaire conservation cinq ans organisme agree',x:'Rapport de contrôle, schémas unifilaires et plans de position signés sont remis au propriétaire pour le dossier de l\'installation. L\'organisme agréé en garde une copie 5 ans. Les documents sont tenus à jour sur place à disposition des personnes autorisées.',r:'RGIE 3.1.2.1 a et d'},
{t:'Commande multiple : va-et-vient, permutateur',k:'va-et-vient va et vient permutateur commutateur intermediaire telerupteur bouton poussoir plusieurs points de commande',x:'Deux interrupteurs va-et-vient commandent les mêmes lampes depuis deux endroits ; à partir de trois points, on intercale des commutateurs intermédiaires entre les deux va-et-vient (ou on utilise un télérupteur avec boutons-poussoirs). Dans ÉlecPlan : touchez le « + » vert au bout de la ligne et ajoutez un va-et-vient ou un commutateur intermédiaire : ils se mettent à la suite sur la même ligne.',r:'Pratique courante (non détaillée dans le RGIE)'},
{t:'ÉlecPlan : démarrer un projet',k:'demarrer commencer projet cartouche dossier fichier ouvrir enregistrer exemple nouveau',x:'Bouton « Cartouche » : adresse, responsable, TVA, tension, courant, versions. Bouton « Fichier » : nouveau projet, ouvrir, enregistrer, exemple. Travaillez ensuite dans l\'ordre des étapes en haut : 1 Schéma unifilaire, 2 Plan de position, 3 Contrôle RGIE, 4 Matériel.',r:'Aide du logiciel'},
{t:'ÉlecPlan : ajouter un circuit et un différentiel',k:'ajouter circuit differentiel groupe lettre calibre section type',x:'Dans le schéma unifilaire, sans rien sélectionner, le panneau de droite propose « Ajouter un circuit » et « + Différentiel ». Touchez l\'en-tête d\'un circuit (disjoncteur, lettre, calibre) pour régler son type, calibre, section, câble et le différentiel qui l\'alimente.',r:'Aide du logiciel'},
{t:'ÉlecPlan : ajouter des composants avec les « + »',k:'ajouter composant plus bouton liste recherche recent insertion ligne',x:'Touchez un « + » bleu entre deux lignes pour insérer une nouvelle ligne à cet endroit, ou un « + » vert au bout d\'une ligne pour ajouter à cette ligne (lampe ou commande sur une ligne d\'interrupteur, prise sur une ligne de prises). Une liste n\'affiche que les composants autorisés ; utilisez la recherche ou les « derniers utilisés ».',r:'Aide du logiciel'},
{t:'ÉlecPlan : pourquoi un ajout est refusé',k:'refuse impossible message lampe seule interrupteur 8 points section dedie',x:'Le logiciel laisse tout essayer mais explique les refus : une lampe exige un interrupteur ou un détecteur sur le circuit ; une prise exige 2,5 mm² ; un appareil dédié exige un circuit à lui seul ; maximum 8 socles par circuit de prises. Le message cite l\'article du RGIE.',r:'Aide du logiciel'},

 let best=null,bd=1e9;rb.items.forEach(it=>{const d=w.x<it.x0?it.x0-w.x:w.x>it.x1?w.x-it.x1:0;const dc=Math.abs(w.x-(it.x0+it.x1)/2);const k=d*1000+dc;if(k<bd){bd=k;best=it}});

let toastT;function toast(m){const h=$('#hint');h.textContent=m;h.style.display='block';clearTimeout(toastT);toastT=setTimeout(updateHint,2200)}
function openProj(){
 const M=S.meta;const fld=(k,l,ph,type)=>'<label>'+l+'</label><input data-pk="'+k+'" value="'+esc(M[k])+'" placeholder="'+(ph||'')+'" '+(type?'type="'+type+'"':'')+'>';
 openModal('Cartouche et informations du dossier','<div class="f" style="grid-template-columns:140px 1fr">'+
  fld('titre','Titre du dossier')+fld('adresse','Adresse de l’installation *','Rue, n°, code postal, commune')+
  fld('nom','Responsable des travaux *','Nom ou société')+fld('qualite','Qualité','ex. Électricien indépendant')+fld('instAdr','Adresse de l’installateur','Rue, n°, code postal, commune')+fld('tel','Téléphone installateur','+32 …')+fld('email','Email installateur','nom@société.be','email')+fld('org','Organisme de contrôle agréé')+
  '<label>Tension *</label><select data-pk="tension">'+['3×400 V + N','3×230 V (sans N)','230 V monophasé'].map(o=>'<option'+(o===M.tension?' selected':'')+'>'+o+'</option>').join('')+'</select>'+
  '<label>Nature du courant *</label><select data-pk="courant">'+['Alternatif ~ 50 Hz','Alternatif ~ 50 Hz + continu (sources)'].map(o=>'<option'+(o===M.courant?' selected':'')+'>'+o+'</option>').join('')+'</select>'+
  '<label style="grid-column:1/-1;font-weight:700">Compteur</label>'+fld('ean','N° EAN','18 chiffres')+fld('numCompteur','N° de compteur')+fld('sect','Sectionneur principal','ex. 63 A')+fld('version','Version','V1.1')+fld('date','Date','', 'date')+fld('terre','Résistance de terre (Ω)','ex. 18')+
  '<label>Signé</label><label style="color:inherit"><input type="checkbox" data-pk="signe" '+(M.signe?'checked':'')+'> signé et daté par le responsable</label></div><div class="mut" style="font-size:12px">* Mentions exigées sur le schéma unifilaire et sur le plan de position (Livre 1, 3.1.2.1).</div>');
 $('#mb').querySelectorAll('[data-pk]').forEach(i=>i.addEventListener('change',()=>{pushUndo();S.meta[i.dataset.pk]=i.type==='checkbox'?i.checked:i.value;save();renderAll()}));
}
$('#btnHelp').onclick=openHelp;
$('#btnProj').onclick=openProj;
function svgDoc(inner,box,title){
 const css='.sym{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sym text{fill:currentColor;stroke:none;font:700 6.5px sans-serif;text-anchor:middle;dominant-baseline:central}';
 return '<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="'+box.x+' '+box.y+' '+box.w+' '+box.h+'" width="'+Math.round(box.w)+'" height="'+Math.round(box.h)+'"><title>'+esc(title)+'</title><style>'+css+'</style>'+inner+'</svg>';
}
function exportPages(){
 computeRefs();const pages=[];const keepSel=UI.sel;UI.sel=null;
 const u=uniSheet({bw:true});pages.push({name:'schema-unifilaire.svg',svg:svgDoc(u,SHEET.uni,'Schéma unifilaire')});
 S.floors.forEach(f=>{const p=planSheet(f,{bw:true});pages.push({name:'plan-position-'+f.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.svg',svg:svgDoc(p,SHEET.plan,'Plan de position – '+f.name)})});
 UI.sel=keepSel;renderStage();return pages;
}
async function saveFile(name,data){
 try{const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:name,data});toast('Fichier enregistré')}
 catch(e){if(e&&e.code==='declined')return;try{await navigator.clipboard.writeText(typeof data==='string'?data:'');toast('Contenu copié (téléchargement indisponible)')}catch(_){openModal('Contenu à copier','<textarea readonly>'+esc(String(data).slice(0,200000))+'</textarea>')}}
}
$('#btnFile').onclick=()=>{
 openModal('Fichier','<div class="row" style="flex-direction:column;align-items:stretch;gap:8px"><b>Dossier à remettre (noir et blanc, avec cartouche et légende)</b><div id="pgs"></div><hr style="width:100%;border:0;border-top:1px solid var(--line)"><div class="row"><button id="fJson">Sauvegarder le projet (JSON)</button><button id="fImp">Ouvrir un projet…</button></div><div class="row"><button id="fNew">Nouveau projet vide</button><button id="fDemo">Charger l’exemple</button></div><div class="mut" style="font-size:12px">Les fichiers SVG s’ouvrent dans un navigateur ; imprimez-les en PDF depuis celui-ci.</div></div>');
 const pages=exportPages();$('#pgs').innerHTML=pages.map((p,i)=>'<button style="width:100%;margin-bottom:6px" data-pg="'+i+'">⬇ '+esc(p.name)+'</button>').join('');
 $('#pgs').onclick=e=>{const b=e.target.closest('[data-pg]');if(b){const p=pages[+b.dataset.pg];saveFile(p.name,p.svg)}};
 $('#fJson').onclick=()=>saveFile('projet-elecplan.json',JSON.stringify(S));
 $('#fImp').onclick=()=>{openModal('Ouvrir un projet','<p class="mut">Collez le contenu JSON du projet.</p><textarea id="jta"></textarea><div class="row" style="margin-top:8px"><button class="pri" id="jImp">Ouvrir</button></div>');$('#jImp').onclick=()=>{try{const o=JSON.parse($('#jta').value);if(!o.floors||!o.circuits||!o.elements)throw 0;pushUndo();S=migrate(o);S.meta=Object.assign(newMeta(),S.meta);UI.sel=null;UI.fitted={};save();$('#modal').hidden=true;renderAll()}catch(e){toast('JSON invalide')}}};
 $('#fNew').onclick=()=>{pushUndo();S=newState();UI.sel=null;UI.fitted={};save();$('#modal').hidden=true;renderAll()};
 $('#fDemo').onclick=()=>{pushUndo();sampleProject();UI.fitted={};save();$('#modal').hidden=true;renderAll()};
};

/* =============== Aperçu avant impression (A4 paysage) =============== */
let PVZ=1;
function pvApply(){const b=$('#pvBody'),base=Math.min(b.clientWidth-28,1100);document.querySelectorAll('.pvpage').forEach(p=>p.style.width=(base*PVZ)+'px')}
function pvZoom(z,cx,cy){const b=$('#pvBody'),old=PVZ;PVZ=Math.max(1,Math.min(6,z));if(PVZ===old)return;const r=b.getBoundingClientRect(),px=(cx===undefined?r.width/2:cx-r.left),py=(cy===undefined?r.height/2:cy-r.top),sx=(b.scrollLeft+px)/old,sy=(b.scrollTop+py)/old;pvApply();b.scrollLeft=sx*PVZ-px;b.scrollTop=sy*PVZ-py}
document.addEventListener('DOMContentLoaded',()=>{});
function fitA4(b){const r=297/210;let w=b.w*1.04,h=b.h*1.04;if(w/h>r)h=w/r;else w=h*r;return{x:b.x+b.w/2-w/2,y:b.y+b.h/2-h/2,w:w,h:h}}
$('#btnPrev').onclick=()=>{
 computeRefs();const keep=UI.sel;UI.sel=null;
 const css='.sym{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sym text{fill:currentColor;stroke:none;font:700 6.5px sans-serif;text-anchor:middle;dominant-baseline:central}';
 const pg=[];const u=uniSheet({bw:true});pg.push({inner:u,box:fitA4(SHEET.uni)});
 S.floors.forEach(f=>{const p=planSheet(f,{bw:true});pg.push({inner:p,box:fitA4(SHEET.plan)})});
 UI.sel=keep;renderStage();
 $('#pvBody').innerHTML=pg.map(p=>'<div class="pvpage"><svg xmlns="http://www.w3.org/2000/svg" viewBox="'+p.box.x+' '+p.box.y+' '+p.box.w+' '+p.box.h+'" preserveAspectRatio="xMidYMid meet"><style>'+css+'</style>'+p.inner+'</svg></div>').join('');
 $('#prev').hidden=false;PVZ=1;pvApply();
};
$('#pvClose').onclick=()=>{$('#prev').hidden=true};
$('#pvPrint').onclick=()=>{try{window.print()}catch(e){toast('Impression indisponible ici : enregistrez les pages (Fichier) puis imprimez-les')}};
/* =============== Démarrage =============== */
(function pvInit(){
 $('#pvIn').onclick=()=>pvZoom(PVZ*1.4);$('#pvOut').onclick=()=>pvZoom(PVZ/1.4);$('#pvFit').onclick=()=>{PVZ=1;pvApply();const b=$('#pvBody');b.scrollLeft=0};
 const b=$('#pvBody');let pd=0,pz=1;const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
 b.addEventListener('touchstart',e=>{if(e.touches.length===2){pd=dist(e.touches);pz=PVZ}},{passive:true});
 b.addEventListener('touchmove',e=>{if(e.touches.length===2&&pd){e.preventDefault();pvZoom(pz*dist(e.touches)/pd,(e.touches[0].clientX+e.touches[1].clientX)/2,(e.touches[0].clientY+e.touches[1].clientY)/2)}},{passive:false});
 b.addEventListener('touchend',e=>{if(e.touches.length<2)pd=0});
 addEventListener('resize',()=>{if(!$('#prev').hidden)pvApply()});
})();
(function init(){
 let ok=false;
 try{const raw=localStorage.getItem('elecplan.v2');if(raw){const o=JSON.parse(raw);if(o&&o.floors&&o.circuits&&o.elements){S=migrate(o);ok=true}}}catch(e){}
 if(!ok)sampleProject();
 if(!S.floors.find(f=>f.id===S.activeFloor))S.activeFloor=S.floors[0].id;
 renderAll();
})();
</script>
</body>
</html>
